name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOME_BACKEND: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: build
        run: ./gradlew -q installDist
      - name: run on the test backend
        run: |
          mkdir -p shots
          bin=build/install/my-goome-app/bin/my-goome-app
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.bat"; fi
          out=$(GOOME_TEST_SHOTS=shots GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 60,28; end 6" "$bin")
          echo "$out"
          ls shots | grep -q ppm
          if [ -d variants ]; then echo "$out" | grep -q "overlay mode"; fi
      - name: other templates
        if: hashFiles('variants/**') != ''
        run: |
          for v in variants/*/; do
            n=$(basename "$v")
            d="$RUNNER_TEMP/v/$n"
            mkdir -p "$d" "shots-$n"
            cp -r src build.gradle settings.gradle gradle.properties gradlew gradlew.bat gradle "$d/"
            cp -r "$v"/. "$d/"
            (cd "$d" && ./gradlew -q installDist)
            bin="$d/build/install/my-goome-app/bin/my-goome-app"
            if [ "$RUNNER_OS" = Windows ]; then bin="$bin.bat"; fi
            GOOME_TEST_SHOTS="shots-$n" GOOME_TEST_SCRIPT="screen 1280x720 1; 2 hotkey alt+m; 3 click 100,140; end 6" "$bin"
            ls "shots-$n" | grep -q ppm
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ runner.os }}
          path: shots*/
          if-no-files-found: ignore
