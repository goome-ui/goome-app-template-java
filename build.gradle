plugins {
    id 'application'
}

repositories {
    mavenCentral()
    ivy {
        url = 'https://github.com/goome-ui/java-goome/releases/download/'
        patternLayout {
            artifact 'v[revision]/[module]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'io.github.goome-ui'
        }
    }
}

dependencies {
    implementation "io.github.goome-ui:goome:$goome_version"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 22
}

application {
    mainClass = 'mygoomeapp.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
