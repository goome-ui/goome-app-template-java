plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "io.github.goome-ui:goome:$goome_version"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 22
}

application {
    mainClass = 'mygoomeapp.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
